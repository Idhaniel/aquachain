# AquaChain network — Hyperledger Fabric v2.5
# 3 Raft orderers + 4 peers (FishFarmers x2, EnergyProvider x1, FishProcessors x1)

name: aquachain

networks:
  aquachain:
    name: aquachain_net

volumes:
  orderer1.aquachain.com:
  orderer2.aquachain.com:
  orderer3.aquachain.com:
  peer0.fishfarmers.aquachain.com:
  peer1.fishfarmers.aquachain.com:
  peer0.energyprovider.aquachain.com:
  peer0.fishprocessors.aquachain.com:

x-orderer-defaults: &orderer-defaults
  image: hyperledger/fabric-orderer:2.5
  environment: &orderer-env
    - FABRIC_LOGGING_SPEC=INFO
    - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
    - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
    - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    - ORDERER_GENERAL_TLS_ENABLED=true
    - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
    - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    - ORDERER_ADMIN_TLS_ENABLED=true
    - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
  working_dir: /root
  command: orderer
  networks:
    - aquachain

x-peer-defaults: &peer-defaults
  image: hyperledger/fabric-peer:2.5
  networks:
    - aquachain

services:
  orderer1.aquachain.com:
    <<: *orderer-defaults
    container_name: orderer1.aquachain.com
    environment:
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer1.aquachain.com:9443
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    volumes:
      - ../organizations/ordererOrganizations/aquachain.com/orderers/orderer1.aquachain.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/aquachain.com/orderers/orderer1.aquachain.com/tls:/var/hyperledger/orderer/tls
      - orderer1.aquachain.com:/var/hyperledger/production/orderer

  orderer2.aquachain.com:
    <<: *orderer-defaults
    container_name: orderer2.aquachain.com
    environment:
      - ORDERER_GENERAL_LISTENPORT=7060
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7063
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer2.aquachain.com:9444
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7060:7060"
      - "7063:7063"
      - "9444:9444"
    volumes:
      - ../organizations/ordererOrganizations/aquachain.com/orderers/orderer2.aquachain.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/aquachain.com/orderers/orderer2.aquachain.com/tls:/var/hyperledger/orderer/tls
      - orderer2.aquachain.com:/var/hyperledger/production/orderer

  orderer3.aquachain.com:
    <<: *orderer-defaults
    container_name: orderer3.aquachain.com
    environment:
      - ORDERER_GENERAL_LISTENPORT=7070
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7073
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer3.aquachain.com:9445
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7070:7070"
      - "7073:7073"
      - "9445:9445"
    volumes:
      - ../organizations/ordererOrganizations/aquachain.com/orderers/orderer3.aquachain.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/aquachain.com/orderers/orderer3.aquachain.com/tls:/var/hyperledger/orderer/tls
      - orderer3.aquachain.com:/var/hyperledger/production/orderer

  peer0.fishfarmers.aquachain.com:
    <<: *peer-defaults
    container_name: peer0.fishfarmers.aquachain.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.fishfarmers.aquachain.com
      - CORE_PEER_ADDRESS=peer0.fishfarmers.aquachain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.fishfarmers.aquachain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.fishfarmers.aquachain.com:7151
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.fishfarmers.aquachain.com:7051
      - CORE_PEER_LOCALMSPID=FishFarmersMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aquachain_net
      - CORE_OPERATIONS_LISTENADDRESS=peer0.fishfarmers.aquachain.com:9446
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    ports:
      - "7051:7051"
      - "9446:9446"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/fishfarmers.aquachain.com/peers/peer0.fishfarmers.aquachain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/fishfarmers.aquachain.com/peers/peer0.fishfarmers.aquachain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.fishfarmers.aquachain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start

  peer1.fishfarmers.aquachain.com:
    <<: *peer-defaults
    container_name: peer1.fishfarmers.aquachain.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer1.fishfarmers.aquachain.com
      - CORE_PEER_ADDRESS=peer1.fishfarmers.aquachain.com:7151
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7151
      - CORE_PEER_CHAINCODEADDRESS=peer1.fishfarmers.aquachain.com:7152
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7152
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.fishfarmers.aquachain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.fishfarmers.aquachain.com:7151
      - CORE_PEER_LOCALMSPID=FishFarmersMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aquachain_net
      - CORE_OPERATIONS_LISTENADDRESS=peer1.fishfarmers.aquachain.com:9447
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    ports:
      - "7151:7151"
      - "9447:9447"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/fishfarmers.aquachain.com/peers/peer1.fishfarmers.aquachain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/fishfarmers.aquachain.com/peers/peer1.fishfarmers.aquachain.com/tls:/etc/hyperledger/fabric/tls
      - peer1.fishfarmers.aquachain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start

  peer0.energyprovider.aquachain.com:
    <<: *peer-defaults
    container_name: peer0.energyprovider.aquachain.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.energyprovider.aquachain.com
      - CORE_PEER_ADDRESS=peer0.energyprovider.aquachain.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.energyprovider.aquachain.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.energyprovider.aquachain.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.energyprovider.aquachain.com:8051
      - CORE_PEER_LOCALMSPID=EnergyProviderMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aquachain_net
      - CORE_OPERATIONS_LISTENADDRESS=peer0.energyprovider.aquachain.com:9448
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    ports:
      - "8051:8051"
      - "9448:9448"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/energyprovider.aquachain.com/peers/peer0.energyprovider.aquachain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/energyprovider.aquachain.com/peers/peer0.energyprovider.aquachain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.energyprovider.aquachain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start

  peer0.fishprocessors.aquachain.com:
    <<: *peer-defaults
    container_name: peer0.fishprocessors.aquachain.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.fishprocessors.aquachain.com
      - CORE_PEER_ADDRESS=peer0.fishprocessors.aquachain.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.fishprocessors.aquachain.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.fishprocessors.aquachain.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.fishprocessors.aquachain.com:9051
      - CORE_PEER_LOCALMSPID=FishProcessorsMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aquachain_net
